name: X-Men Mutant Registry - Rollback

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER: xmen-cluster
  DEPLOYMENT_NAME: mutant-registry

jobs:
  rollback:
    name: Roll back failed deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Show deployment before rollback
        run: |
          kubectl rollout history deployment/$DEPLOYMENT_NAME
          kubectl get deployment $DEPLOYMENT_NAME
          kubectl get pods -l app=mutant-registry -o wide

      - name: Roll back to the previous revision
        run: |
          kubectl rollout undo deployment/$DEPLOYMENT_NAME

      - name: Verify rollback
        run: |
          kubectl rollout status deployment/$DEPLOYMENT_NAME \
            --timeout=240s

          kubectl get deployment $DEPLOYMENT_NAME
          kubectl get pods -l app=mutant-registry -o wide

          echo "Rollback completed successfully."

      - name: Show diagnostics if rollback fails
        if: failure()
        run: |
          kubectl describe deployment $DEPLOYMENT_NAME || true
          kubectl get pods -l app=mutant-registry -o wide || true
          kubectl get events \
            --sort-by=.metadata.creationTimestamp || true
