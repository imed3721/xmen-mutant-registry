name: X-Men Mutant Registry CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: xmen-mutant-registry
  EKS_CLUSTER: xmen-cluster
  DEPLOYMENT_NAME: mutant-registry
  CONTAINER_NAME: mutant-registry

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check application syntax
        run: node --check server.js

      - name: Run application tests
        run: node test.js

  deploy:
    name: Build and deploy to AWS
    needs: test
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Verify required tools
        run: |
          aws --version
          kubectl version --client
          docker --version

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker image to ECR
        run: |
          docker push "$IMAGE"

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER"

      - name: Prepare Kubernetes manifest
        run: |
          test -f k8s/deployment.yaml
          test -f k8s/service.yaml

          grep -q 'IMAGE_PLACEHOLDER' k8s/deployment.yaml || {
            echo "::error::IMAGE_PLACEHOLDER not found in deployment manifest"
            exit 1
          }

          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" \
            k8s/deployment.yaml \
            > "$RUNNER_TEMP/deployment.yaml"

          if grep -q 'IMAGE_PLACEHOLDER' "$RUNNER_TEMP/deployment.yaml"; then
            echo "::error::Image placeholder was not replaced"
            exit 1
          fi

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f "$RUNNER_TEMP/deployment.yaml"
          kubectl apply -f k8s/service.yaml

      - name: Wait for rollout
        run: |
          if ! kubectl rollout status \
            "deployment/$DEPLOYMENT_NAME" \
            --timeout=180s; then

            echo "::error::Deployment rollout failed"

            echo "=== Deployment details ==="
            kubectl describe deployment "$DEPLOYMENT_NAME" || true

            echo "=== ReplicaSets ==="
            kubectl get replicasets -o wide || true

            echo "=== Pod status ==="
            kubectl get pods \
              -l app=mutant-registry \
              -o wide || true

            echo "=== Pod details ==="
            kubectl describe pods \
              -l app=mutant-registry || true

            echo "=== Recent Kubernetes events ==="
            kubectl get events \
              --sort-by=.metadata.creationTimestamp || true

            echo "=== Current container logs ==="
            kubectl logs \
              -l app=mutant-registry \
              -c "$CONTAINER_NAME" \
              --tail=100 \
              --prefix=true || true

            echo "=== Previous container logs ==="
            kubectl logs \
              -l app=mutant-registry \
              -c "$CONTAINER_NAME" \
              --previous \
              --tail=100 \
              --prefix=true || true

            exit 1
          fi

      - name: Show Kubernetes resources
        if: always()
        run: |
          kubectl get deployment "$DEPLOYMENT_NAME" || true
          kubectl get pods -l app=mutant-registry -o wide || true
          kubectl get service "$DEPLOYMENT_NAME" || true
